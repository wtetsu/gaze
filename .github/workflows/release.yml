name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest]
        go-version: ["1.27"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Verify version
        run: |
          VERSION_FILE=$(cat cmd/gaze/version)
          TAG_VERSION=${GITHUB_REF_NAME}
          if [ "$VERSION_FILE" != "$TAG_VERSION" ]; then
            echo "Error: Version in version file ($VERSION_FILE) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
      - name: Package
        run: make package
      - name: License
        run: |
          go run github.com/google/go-licenses/v2@v2.0.1 save ./... --save_path=license
          go run github.com/google/go-licenses/v2@v2.0.1 csv ./... | tee license/license.csv
          zip -r ./license.zip ./license
      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            license.zip
